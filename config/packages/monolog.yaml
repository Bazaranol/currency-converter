monolog:
    channels:
        - exchange_rates
        - api_client

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]

            exchange_rates:
                type: stream
                path: "%kernel.logs_dir%/exchange_rates.log"
                level: info
                channels: [exchange_rates]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                buffer_size: 50
                excluded_http_codes: [404, 405]

            nested:
                type: stream
                path: "php://stderr"
                level: debug
                formatter: monolog.formatter.json

            exchange_rates:
                type: stream
                path: "php://stderr"
                level: info
                channels: [exchange_rates]
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
