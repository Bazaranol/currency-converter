server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # ── Security headers ──
    add_header X-Frame-Options       "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-XSS-Protection      "1; mode=block"    always;

    # ── Logging ──
    access_log /var/log/nginx/currency_access.log;
    error_log  /var/log/nginx/currency_error.log;

    # ── Symfony front controller ──
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ── PHP-FPM handler ──
    location ~ ^/index\.php(/|$) {
        fastcgi_pass  app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Buffer settings for large Symfony responses
        fastcgi_buffer_size        128k;
        fastcgi_buffers            4 256k;
        fastcgi_busy_buffers_size  256k;

        # Timeouts
        fastcgi_read_timeout 300;

        # Prevent URI from being passed to PHP for non-existent files
        internal;
    }

    # ── Block direct access to any other .php file ──
    location ~ \.php$ {
        return 404;
    }

    # ── Static assets caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny dotfiles (except .well-known) ──
    location ~ /\.(?!well-known) {
        deny all;
    }
}
